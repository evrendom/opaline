name: repo-stats

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: repo-stats
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Read the saved numbers
        run: |
          mkdir stats-data
          if git ls-remote --exit-code --heads "https://github.com/${GITHUB_REPOSITORY}.git" stats >/dev/null; then
            git fetch --depth=1 "https://github.com/${GITHUB_REPOSITORY}.git" stats
            git archive FETCH_HEAD | tar -x -C stats-data
          fi

      - name: Add today's numbers
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO_STATS_TOKEN: ${{ secrets.REPO_STATS_TOKEN }}
        run: bun scripts/repo-stats.ts snapshot --dir stats-data

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stats-data
          path: stats-data
          retention-days: 3
          if-no-files-found: error

  commit:
    needs: collect
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - name: Check out the stats branch
        run: |
          if git ls-remote --exit-code --heads origin stats >/dev/null; then
            git fetch --depth=1 origin stats
            git worktree add --detach stats-data FETCH_HEAD
          else
            git worktree add --detach stats-data
            git -C stats-data switch --orphan stats
          fi
          find stats-data -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: stats-data
          path: stats-data

      - name: Commit to the stats branch
        working-directory: stats-data
        run: |
          bad=$(find . -path ./.git -prune -o -type f ! -name '*.csv' ! -name README.md -print)
          if [ -n "$bad" ]; then
            echo "::error::unexpected files from the collect job: $bad"
            exit 1
          fi
          git add -A
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "stats: $(date -u +%F)"
          git push origin HEAD:refs/heads/stats
