name: repo-stats

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-stats
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Check out the stats branch
        run: |
          if git ls-remote --exit-code --heads origin stats >/dev/null; then
            git fetch --depth=1 origin stats
            git worktree add --detach stats-data FETCH_HEAD
          else
            git worktree add --detach stats-data
            git -C stats-data switch --orphan stats
          fi

      - name: Save today's numbers
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO_STATS_TOKEN: ${{ secrets.REPO_STATS_TOKEN }}
        run: bun scripts/repo-stats.ts snapshot --dir stats-data

      - name: Commit to the stats branch
        working-directory: stats-data
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "stats: $(date -u +%F)"
          git push origin HEAD:refs/heads/stats
