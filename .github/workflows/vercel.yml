name: Vercel

on:
  workflow_call:
    inputs:
      target:
        description: Vercel deployment environment
        required: true
        type: string
    secrets:
      VERCEL_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      target:
        description: Vercel deployment environment
        required: true
        type: choice
        default: preview
        options:
          - preview
          - production

permissions:
  contents: read

concurrency:
  group: vercel-${{ github.event.pull_request.number || github.ref }}-${{ inputs.target || 'preview' }}
  cancel-in-progress: ${{ (inputs.target || 'preview') != 'production' }}

jobs:
  deploy:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    environment: ${{ inputs.target == 'production' && 'production' || 'preview' }}
    env:
      DEPLOY_ENVIRONMENT: ${{ inputs.target || 'preview' }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install pinned Vercel CLI
        run: npm install --global --ignore-scripts vercel@59.1.3

      - name: Require explicit Vercel target
        shell: bash
        run: |
          [[ -n "${VERCEL_TOKEN}" ]]
          [[ -n "${VERCEL_ORG_ID}" ]]
          [[ -n "${VERCEL_PROJECT_ID}" ]]
          [[ "${DEPLOY_ENVIRONMENT}" == "preview" || "${DEPLOY_ENVIRONMENT}" == "production" ]]
          if [[ "${DEPLOY_ENVIRONMENT}" == "production" && "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Production deploys must run from main." >&2
            exit 1
          fi

      - name: Deploy source on Vercel
        id: deploy
        shell: bash
        run: |
          deploy_args=()
          if [[ "${DEPLOY_ENVIRONMENT}" == "production" ]]; then
            deploy_args+=(--prod --skip-domain)
          fi
          deployment_url="$(vercel deploy --archive=tgz --yes "${deploy_args[@]}" --scope=opalinehq)"
          if [[ ! "${deployment_url}" =~ ^https://[a-zA-Z0-9.-]+\.vercel\.app$ ]]; then
            echo "Vercel returned an invalid deployment URL." >&2
            exit 1
          fi
          echo "url=${deployment_url}" >> "${GITHUB_OUTPUT}"
          echo "### Vercel ${DEPLOY_ENVIRONMENT} deployment" >> "${GITHUB_STEP_SUMMARY}"
          echo "${deployment_url}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Smoke health, RPC body, and web shell
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          vercel curl /health \
            --deployment "${DEPLOYMENT_URL}" \
            --scope=opalinehq \
            --yes \
            -- --fail --silent --show-error \
            | jq --exit-status '.status == "ok"'
          vercel curl /rpc/health \
            --deployment "${DEPLOYMENT_URL}" \
            --scope=opalinehq \
            --yes \
            -- --fail --silent --show-error \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{}' \
            | jq --exit-status '.json.status == "ok"'
          vercel curl / \
            --deployment "${DEPLOYMENT_URL}" \
            --scope=opalinehq \
            --yes \
            -- --fail --silent --show-error --output /tmp/opaline-index.html
          test -s /tmp/opaline-index.html
          vercel curl /api/demo/rpc/analytics/sessions/list \
            --deployment "${DEPLOYMENT_URL}" \
            --scope=opalinehq \
            --yes \
            -- --fail --silent --show-error \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{"json":{"limit":1}}' \
            | jq --exit-status '.json | type == "array"'

      - name: Promote verified production deployment
        if: inputs.target == 'production'
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          latest_main_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "${latest_main_sha}" != "${GITHUB_SHA}" ]]; then
            echo "Skipping promotion: main has moved past this commit." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          vercel promote "${DEPLOYMENT_URL}" --yes --scope=opalinehq
