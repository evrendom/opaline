name: CI

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read


concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Job-level conditions skip drafts before allocating a runner.
  changes:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      integration: ${{ steps.integration.outputs.integration == 'true' || steps.integration.outputs.skill == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 20

      # Integration exercises the API, CLI, marketing build, packages and
      # scripts. The web app, the MCP plugin code (no integration test reaches
      # it) and Markdown outside the plugin skill cannot change its outcome, so
      # PRs touching only those skip it. Every listed condition must hold for a
      # changed file of the integration filter; the skill filter runs the
      # skill's SQL examples.
      - name: Detect integration changes
        id: integration
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          base: main
          predicate-quantifier: every
          filters: |
            integration:
              - "{apps/api/**,apps/cli/**,apps/cli-harness/**,apps/marketing/**,packages/**,scripts/**,.github/actions/setup/**,.github/workflows/ci.yml,bun.lock,package.json,turbo.json,deploy/cloud/vercel.json}"
              - "!apps/api/src/mcp/**"
              - "!apps/api/src/handlers/mcp-http*"
              - "!**/*.md"
            skill:
              - "plugin/skills/**"

  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # 8vcpu: the api unit suite runs in one bun process whose accumulated heap
    # OOM-killed (exit 137) the 4vcpu runner even at turbo concurrency 1.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup Bun
        uses: ./.github/actions/setup

      - name: Check for local overrides
        run: bun scripts/check-overrides.ts

      - name: Check for accidental disclosures
        run: bun run check:disclosure

      - name: Test disclosure checker
        run: bun test scripts/check-disclosure.test.ts

      - name: Test the self-hosted artifact packer
        run: bun test ./scripts/selfhost-artifact.test.ts

      - name: Check pull request disclosure channels
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun scripts/check-disclosure.ts --commits "${{ github.event.pull_request.base.sha }}"
          bun scripts/check-disclosure.ts --pull-request "${{ github.event.pull_request.number }}"

      - name: Verify
        run: |
          bun run turbo run lint check-types test --concurrency=1
          bun run check-types:vercel

      # build:site below builds the web and marketing workspaces once.
      - name: Build API and CLI
        run: bun run turbo run build --filter='!@rudel/web' --filter='!@rudel/marketing' --concurrency=1

      - name: Build combined marketing, demo, and product
        run: bun run build:site

      - name: Verify browser resource budgets in Chrome
        run: bun run --cwd apps/web test:resource-budgets:chrome

  integration:
    # Pushes to main follow the same filter (the production deploy accepts a
    # skip); manual deploys always run it.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      ((github.event_name == 'push' ||
      github.event.pull_request.draft == false) &&
      needs.changes.outputs.integration == 'true')
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.10-alpine
        env:
          POSTGRES_DB: rudel
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username postgres --dbname rudel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    # These credentials are only for the disposable services created above.
    env:
      PASSWORD_AUTH_EMAILS: "*"
      PG_CONNECTION_STRING: postgres://postgres:postgres@localhost:5432/rudel
      PG_DIRECT_CONNECTION_STRING: postgres://postgres:postgres@localhost:5432/rudel
      CLICKHOUSE_URL: http://localhost:8123
      CLICKHOUSE_USER: rudel
      CLICKHOUSE_USERNAME: rudel
      CLICKHOUSE_PASSWORD: rudel-ci
      CLICKHOUSE_DB: default
      CLICKHOUSE_CREDENTIAL_TEST_URL: http://localhost.:8124
      CLICKHOUSE_CREDENTIAL_TEST_USERNAME: rudel_app
      CLICKHOUSE_CREDENTIAL_TEST_PASSWORD: rudel-app-ci
      CLICKHOUSE_CREDENTIAL_TEST_DEFAULT_PASSWORD: default-ci
      SKILL_EXTRACTION_ENABLED: "true"
      SKILL_ANALYTICS_CUTOVER_MODE: all
      SKILL_ANALYTICS_CANARY_ORG_IDS: ""
      SKILL_BACKFILL_MAX_SESSIONS: "10000"
      SKILL_BACKFILL_MAX_SESSION_BYTES: "536870912"
      SKILL_BACKFILL_BATCH_MAX_ROWS: "64"
      SKILL_BACKFILL_BATCH_MAX_BYTES: "134217728"
      TRANSCRIPT_RECORDS_EXTRACTION_ENABLED: "true"
      GIT_OBSERVATION_EXTRACTION_ENABLED: "true"
      GITHUB_SWEEP_ENABLED: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup Bun
        uses: ./.github/actions/setup

      - name: Start ClickHouse
        run: |
          docker run --detach \
            --name rudel-ci-clickhouse \
            --publish 8123:8123 \
            --env CLICKHOUSE_DB=default \
            --env CLICKHOUSE_USER=rudel \
            --env CLICKHOUSE_PASSWORD=rudel-ci \
            --env CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1 \
            --volume "${GITHUB_WORKSPACE}/.github/clickhouse/config.d/storage-policy.xml:/etc/clickhouse-server/config.d/storage-policy.xml:ro" \
            clickhouse/clickhouse-server:26.3.17.56

          docker run --detach \
            --name rudel-ci-clickhouse-credentials \
            --publish 8124:8123 \
            --env CLICKHOUSE_DB=default \
            --env CLICKHOUSE_PASSWORD=default-ci \
            --env CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1 \
            clickhouse/clickhouse-server:26.3.17.56

      - name: Wait for ClickHouse
        run: |
          wait_for_clickhouse() {
            local container="$1"
            local credentials="$2"
            local url="$3"

            for attempt in {1..60}; do
              if curl --fail --silent --user "${credentials}" "${url}/ping" | grep --quiet Ok; then
                return 0
              fi
              sleep 1
            done

            docker logs "${container}"
            return 1
          }

          wait_for_clickhouse \
            rudel-ci-clickhouse \
            rudel:rudel-ci \
            http://localhost:8123
          wait_for_clickhouse \
            rudel-ci-clickhouse-credentials \
            default:default-ci \
            http://localhost:8124

      - name: Provision ClickHouse credential test user
        run: |
          curl --fail --silent --show-error \
            --user default:default-ci \
            --data-binary "CREATE USER rudel_app IDENTIFIED WITH sha256_password BY 'rudel-app-ci'" \
            http://localhost:8124/

      - name: Run Postgres migrations
        run: bun run --cwd packages/sql-schema migrate

      - name: Bootstrap fresh ClickHouse (original checksums and controlled F16 verification)
        run: bun run --cwd packages/ch-schema ch:bootstrap

      - name: Run integration tests
        run: bun run turbo run test:integration --concurrency=1 --log-order=stream

      - name: Verify homepage authentication routing
        env:
          APP_URL: http://localhost
          ALLOWED_ORIGIN: http://localhost
          BETTER_AUTH_SECRET: test-secret-for-integration-tests
          NODE_ENV: test
        run: |
          bun run --cwd apps/marketing build
          mkdir -p dist-site
          cp apps/marketing/dist/index.html dist-site/marketing.html
          bun test ./apps/api/src/__tests__/vercel-home.integration.ts

      - name: Fetch the published rudel@0.1.17 CLI
        run: |
          mkdir -p .tmp/old-cli
          curl -fsSL -o .tmp/old-cli/rudel-0.1.17.tgz https://registry.npmjs.org/rudel/-/rudel-0.1.17.tgz
          tar -xzf .tmp/old-cli/rudel-0.1.17.tgz -C .tmp/old-cli
          node .tmp/old-cli/package/dist/cli.js --version

      - name: Run version-skew tests against the published 0.1.17 CLI
        run: bun run --cwd apps/cli-harness test:integration:skew
        env:
          RUDEL_OLD_CLI_PATH: ${{ github.workspace }}/.tmp/old-cli/package/dist/cli.js

  main-head:
    if: >-
      ${{ !cancelled() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.verify.result == 'success' &&
      (needs.integration.result == 'success' ||
      needs.integration.result == 'skipped') }}
    needs: [verify, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      current: ${{ steps.head.outputs.current }}
    steps:
      # The production deploy lock keeps one pending deploy and cancels any
      # older pending one, so a superseded commit that finishes CI late would
      # cancel the deploy of main's HEAD, and then nothing is promoted.
      - name: Is this commit still main's HEAD
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [[ "${head_sha}" == "${GITHUB_SHA}" ]]; then
            echo "current=true" >> "${GITHUB_OUTPUT}"
          else
            echo "current=false" >> "${GITHUB_OUTPUT}"
            echo "Skipping deploy: main has moved to ${head_sha}, whose run deploys this commit too." >> "${GITHUB_STEP_SUMMARY}"
          fi

  deploy-vercel:
    if: >-
      ${{ !cancelled() &&
      github.repository == 'opalinehq/athena' &&
      needs.main-head.outputs.current == 'true' }}
    needs: [verify, integration, main-head]
    uses: ./.github/workflows/vercel.yml
    with:
      target: production
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      PG_CONNECTION_STRING: ${{ secrets.PG_CONNECTION_STRING }}

  cli-smoke:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - windows-2025
        node:
          - 20
        include:
          - os: ubuntu-24.04
            node: 22
          - os: ubuntu-24.04
            node: 24
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Setup Bun
        uses: ./.github/actions/setup

      - name: Verify settings recovery and hook migration
        env:
          POSTHOG_ENABLED: "false"
        run: bun test apps/cli/src/__tests__/auto-upload-config.test.ts apps/cli/src/__tests__/upload-manager-migration.test.ts

      - name: Pack and install all three CLI packages
        shell: bash
        run: |
          rm -rf .tmp/cli-smoke
          mkdir -p .tmp/cli-smoke/package .tmp/cli-smoke/install
          opaline_tarball="$(npm pack ./apps/cli --pack-destination .tmp/cli-smoke/package | tail -n 1)"
          primary_tarball="$(npm pack ./packages/opaline --pack-destination .tmp/cli-smoke/package | tail -n 1)"
          rudel_tarball="$(npm pack ./packages/rudel-alias --pack-destination .tmp/cli-smoke/package | tail -n 1)"
          npm install \
            --prefix .tmp/cli-smoke/install \
            --ignore-scripts \
            --no-audit \
            --no-fund \
            ".tmp/cli-smoke/package/${opaline_tarball}" \
            ".tmp/cli-smoke/package/${primary_tarball}" \
            ".tmp/cli-smoke/package/${rudel_tarball}"

      - name: Verify canonical and alias behavior
        shell: bash
        run: |
          opaline_cli=".tmp/cli-smoke/install/node_modules/@opalinehq/cli/dist/cli.js"
          primary_cli=".tmp/cli-smoke/install/node_modules/opaline/bin/opaline.js"
          rudel_cli=".tmp/cli-smoke/install/node_modules/rudel/bin/rudel.js"

          version="$(node -p "require('./apps/cli/package.json').version")"
          for package_dir in packages/opaline packages/rudel-alias; do
            test "$(node -p "require('./${package_dir}/package.json').version")" = "${version}"
            test "$(node -p "require('./${package_dir}/package.json').dependencies['@opalinehq/cli']")" = "${version}"
          done

          for cli in "${opaline_cli}" "${primary_cli}" "${rudel_cli}"; do
            test "$(node "${cli}" --version)" = "${version}"
          done

          node "${opaline_cli}" --help > .tmp/cli-smoke/opaline-help.stdout 2> .tmp/cli-smoke/opaline-help.stderr
          node "${primary_cli}" --help > .tmp/cli-smoke/primary-help.stdout 2> .tmp/cli-smoke/primary-help.stderr
          node "${rudel_cli}" --help > .tmp/cli-smoke/rudel-help.stdout 2> .tmp/cli-smoke/rudel-help.stderr
          cmp .tmp/cli-smoke/opaline-help.stdout .tmp/cli-smoke/primary-help.stdout
          cmp .tmp/cli-smoke/opaline-help.stderr .tmp/cli-smoke/primary-help.stderr
          cmp .tmp/cli-smoke/opaline-help.stdout .tmp/cli-smoke/rudel-help.stdout
          test "$(head -n 1 .tmp/cli-smoke/rudel-help.stderr)" = "rudel is now opaline"
          tail -n +2 .tmp/cli-smoke/rudel-help.stderr | cmp .tmp/cli-smoke/opaline-help.stderr -

          set +e
          node "${opaline_cli}" not-a-command > .tmp/cli-smoke/opaline-error.stdout 2> .tmp/cli-smoke/opaline-error.stderr
          opaline_exit=$?
          node "${primary_cli}" not-a-command > .tmp/cli-smoke/primary-error.stdout 2> .tmp/cli-smoke/primary-error.stderr
          primary_exit=$?
          node "${rudel_cli}" not-a-command > .tmp/cli-smoke/rudel-error.stdout 2> .tmp/cli-smoke/rudel-error.stderr
          rudel_exit=$?
          set -e

          test "${opaline_exit}" -ne 0
          test "${opaline_exit}" -eq "${rudel_exit}"
          test "${opaline_exit}" -eq "${primary_exit}"
          cmp .tmp/cli-smoke/opaline-error.stdout .tmp/cli-smoke/primary-error.stdout
          cmp .tmp/cli-smoke/opaline-error.stderr .tmp/cli-smoke/primary-error.stderr
          cmp .tmp/cli-smoke/opaline-error.stdout .tmp/cli-smoke/rudel-error.stdout
          tail -n +2 .tmp/cli-smoke/rudel-error.stderr | cmp .tmp/cli-smoke/opaline-error.stderr -

          mkdir -p .tmp/cli-smoke/opaline-config .tmp/cli-smoke/primary-config .tmp/cli-smoke/rudel-config
          hook_input='{"session_id":"","transcript_path":"","cwd":""}'
          printf '%s' "${hook_input}" | OPALINE_CONFIG_DIR=.tmp/cli-smoke/opaline-config node "${opaline_cli}" hooks claude session-end > .tmp/cli-smoke/opaline-stdin.stdout 2> .tmp/cli-smoke/opaline-stdin.stderr
          opaline_stdin_exit=$?
          printf '%s' "${hook_input}" | OPALINE_CONFIG_DIR=.tmp/cli-smoke/primary-config node "${primary_cli}" hooks claude session-end > .tmp/cli-smoke/primary-stdin.stdout 2> .tmp/cli-smoke/primary-stdin.stderr
          primary_stdin_exit=$?
          printf '%s' "${hook_input}" | OPALINE_CONFIG_DIR=.tmp/cli-smoke/rudel-config node "${rudel_cli}" hooks claude session-end > .tmp/cli-smoke/rudel-stdin.stdout 2> .tmp/cli-smoke/rudel-stdin.stderr
          rudel_stdin_exit=$?

          test "${opaline_stdin_exit}" -eq "${rudel_stdin_exit}"
          test "${opaline_stdin_exit}" -eq "${primary_stdin_exit}"
          cmp .tmp/cli-smoke/opaline-stdin.stdout .tmp/cli-smoke/primary-stdin.stdout
          cmp .tmp/cli-smoke/opaline-stdin.stderr .tmp/cli-smoke/primary-stdin.stderr
          cmp .tmp/cli-smoke/opaline-stdin.stdout .tmp/cli-smoke/rudel-stdin.stdout
          tail -n +2 .tmp/cli-smoke/rudel-stdin.stderr | cmp .tmp/cli-smoke/opaline-stdin.stderr -

      - name: Run packed CLI smoke suite through opaline
        shell: bash
        run: bun run --cwd apps/cli test:packed-smoke
        env:
          OPALINE_PACKED_CLI: ${{ github.workspace }}/.tmp/cli-smoke/install/node_modules/opaline/bin/opaline.js

      - name: Verify Windows browser opening
        if: runner.os == 'Windows'
        shell: bash
        run: bun test ./apps/cli/src/__tests__/browser-opener.windows.integration.ts

  cli-smoke-required:
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    needs:
      - cli-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require successful CLI smoke tests when applicable
        env:
          CLI_SMOKE_RESULT: ${{ needs.cli-smoke.result }}
        run: |
          if [[ "${CLI_SMOKE_RESULT}" != "success" && "${CLI_SMOKE_RESULT}" != "skipped" ]]; then
            echo "CLI smoke tests did not succeed: ${CLI_SMOKE_RESULT}"
            exit 1
          fi
