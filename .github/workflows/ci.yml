name: CI

on:
  workflow_dispatch:
    inputs:
      migrate_only:
        description: Apply Postgres migrations without deploying the legacy Fly app
        type: boolean
        default: false
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read


concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Job-level conditions skip drafts before allocating a runner or expanding a matrix.
  changes:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      cli: ${{ steps.filter.outputs.cli }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 20

      - name: Detect CLI changes
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          base: main
          filters: |
            cli:
              - "apps/cli/**"
              - "packages/agent-adapters/**"
              - "packages/ch-schema/**"
              - "packages/api-routes/**"
              - "packages/secret-filter/**"
              - "packages/typescript-config/**"
              - "package.json"
              - "bun.lock"
              - ".github/actions/setup/**"
              - ".github/workflows/ci.yml"

  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # 8vcpu: the api unit suite runs in one bun process whose accumulated heap
    # OOM-killed (exit 137) the 4vcpu runner even at turbo concurrency 1.
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup Bun
        uses: ./.github/actions/setup

      - name: Check for local overrides
        run: bun scripts/check-overrides.ts

      - name: Check for accidental disclosures
        run: bun run check:disclosure

      - name: Test disclosure checker
        run: bun test scripts/check-disclosure.test.ts

      - name: Check pull request disclosure channels
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun scripts/check-disclosure.ts --commits "${{ github.event.pull_request.base.sha }}"
          bun scripts/check-disclosure.ts --pull-request "${{ github.event.pull_request.number }}"

      - name: Verify
        run: |
          bun run turbo run lint check-types test --concurrency=1
          bun run check-types:vercel

      # build:site below builds the web and marketing workspaces once.
      - name: Build API and CLI
        run: bun run turbo run build --filter='!@rudel/web' --filter='!@rudel/marketing' --concurrency=1

      - name: Build combined marketing, demo, and product
        run: bun run build:site

      - name: Verify browser resource budgets in Chrome
        run: bun run --cwd apps/web test:resource-budgets:chrome

  integration:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.10-alpine
        env:
          POSTGRES_DB: rudel
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username postgres --dbname rudel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    # These credentials are only for the disposable services created above.
    env:
      PG_CONNECTION_STRING: postgres://postgres:postgres@localhost:5432/rudel
      PG_DIRECT_CONNECTION_STRING: postgres://postgres:postgres@localhost:5432/rudel
      CLICKHOUSE_URL: http://localhost:8123
      CLICKHOUSE_USER: rudel
      CLICKHOUSE_USERNAME: rudel
      CLICKHOUSE_PASSWORD: rudel-ci
      CLICKHOUSE_DB: default
      CLICKHOUSE_CREDENTIAL_TEST_URL: http://localhost.:8124
      CLICKHOUSE_CREDENTIAL_TEST_USERNAME: rudel_app
      CLICKHOUSE_CREDENTIAL_TEST_PASSWORD: rudel-app-ci
      CLICKHOUSE_CREDENTIAL_TEST_DEFAULT_PASSWORD: default-ci
      SKILL_EXTRACTION_ENABLED: "true"
      SKILL_ANALYTICS_CUTOVER_MODE: all
      SKILL_ANALYTICS_CANARY_ORG_IDS: ""
      SKILL_BACKFILL_MAX_SESSIONS: "10000"
      SKILL_BACKFILL_MAX_SESSION_BYTES: "536870912"
      SKILL_BACKFILL_BATCH_MAX_ROWS: "64"
      SKILL_BACKFILL_BATCH_MAX_BYTES: "134217728"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup Bun
        uses: ./.github/actions/setup

      - name: Start ClickHouse
        run: |
          docker run --detach \
            --name rudel-ci-clickhouse \
            --publish 8123:8123 \
            --env CLICKHOUSE_DB=default \
            --env CLICKHOUSE_USER=rudel \
            --env CLICKHOUSE_PASSWORD=rudel-ci \
            --env CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1 \
            --volume "${GITHUB_WORKSPACE}/.github/clickhouse/config.d/storage-policy.xml:/etc/clickhouse-server/config.d/storage-policy.xml:ro" \
            clickhouse/clickhouse-server:26.3.17.56

          docker run --detach \
            --name rudel-ci-clickhouse-credentials \
            --publish 8124:8123 \
            --env CLICKHOUSE_DB=default \
            --env CLICKHOUSE_PASSWORD=default-ci \
            --env CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1 \
            clickhouse/clickhouse-server:26.3.17.56

      - name: Wait for ClickHouse
        run: |
          wait_for_clickhouse() {
            local container="$1"
            local credentials="$2"
            local url="$3"

            for attempt in {1..60}; do
              if curl --fail --silent --user "${credentials}" "${url}/ping" | grep --quiet Ok; then
                return 0
              fi
              sleep 1
            done

            docker logs "${container}"
            return 1
          }

          wait_for_clickhouse \
            rudel-ci-clickhouse \
            rudel:rudel-ci \
            http://localhost:8123
          wait_for_clickhouse \
            rudel-ci-clickhouse-credentials \
            default:default-ci \
            http://localhost:8124

      - name: Provision ClickHouse credential test user
        run: |
          curl --fail --silent --show-error \
            --user default:default-ci \
            --data-binary "CREATE USER rudel_app IDENTIFIED WITH sha256_password BY 'rudel-app-ci'" \
            http://localhost:8124/

      - name: Run Postgres migrations
        run: bun run --cwd packages/sql-schema migrate

      - name: Apply pre-F16 ClickHouse prerequisites (disposable CI only)
        working-directory: packages/ch-schema
        env:
          F16_NONPROD_APPLY_PREREQUISITES: ci-only
        run: bun run ch:migrate:f16:ci-prerequisites

      - name: Run controlled F16 ClickHouse migration (evidence-backed CI auto-approval)
        working-directory: packages/ch-schema
        env:
          F16_BACKFILL_BUCKET_COUNT: "2"
          F16_CATALOG_BARRIER_TIMEOUT_MS: "120000"
          F16_CLICKHOUSE_TOPOLOGY: single-node
          F16_DDL_TASK_TIMEOUT_SECONDS: "180"
          F16_MAX_BYTES_BEFORE_EXTERNAL_GROUP_BY: "268435456"
          F16_MAX_BYTES_BEFORE_EXTERNAL_SORT: "268435456"
          F16_MAX_MEMORY_USAGE_BYTES: "2147483648"
          F16_MAX_TEMPORARY_DATA_ON_DISK_BYTES: "4294967296"
          F16_MIGRATION_REQUEST_TIMEOUT_MS: "600000"
          F16_NONPROD_AUTO_APPROVE_CHECKPOINTS: ci-only
        run: bun run ch:migrate:f16

      - name: Apply product launch ClickHouse metadata
        run: bun run --cwd packages/ch-schema ch:migrate:product-launch

      - name: Apply ClickHouse storage probe table
        run: bun run --cwd packages/ch-schema ch:migrate:dependency-health

      - name: Apply Dashboard language-signal columns
        run: bun run --cwd packages/ch-schema ch:migrate:language-signals

      - name: Run integration tests
        run: bun run turbo run test:integration --concurrency=1 --log-order=stream

      - name: Fetch the published rudel@0.1.17 CLI
        run: |
          mkdir -p .tmp/old-cli
          curl -fsSL -o .tmp/old-cli/rudel-0.1.17.tgz https://registry.npmjs.org/rudel/-/rudel-0.1.17.tgz
          tar -xzf .tmp/old-cli/rudel-0.1.17.tgz -C .tmp/old-cli
          node .tmp/old-cli/package/dist/cli.js --version

      - name: Run version-skew tests against the published 0.1.17 CLI
        run: bun run --cwd apps/cli test:integration:skew
        env:
          RUDEL_OLD_CLI_PATH: ${{ github.workspace }}/.tmp/old-cli/package/dist/cli.js

  cli-smoke:
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.changes.outputs.cli == 'true'
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        os:
          - blacksmith-4vcpu-ubuntu-2404
          - blacksmith-6vcpu-macos-15
          - blacksmith-2vcpu-windows-2025
        node:
          - 20
        include:
          - os: blacksmith-4vcpu-ubuntu-2404
            node: 22
          - os: blacksmith-4vcpu-ubuntu-2404
            node: 24
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Setup Bun
        uses: ./.github/actions/setup

      - name: Pack and run the installed CLI
        shell: bash
        run: |
          rm -rf .tmp/cli-smoke
          mkdir -p .tmp/cli-smoke/package
          npm pack ./apps/cli --pack-destination .tmp/cli-smoke/package
          npm install \
            --prefix .tmp/cli-smoke/install \
            --ignore-scripts \
            --no-audit \
            --no-fund \
            .tmp/cli-smoke/package/rudel-*.tgz
          node .tmp/cli-smoke/install/node_modules/rudel/dist/cli.js --help

      - name: Run the packed-CLI smoke suite
        shell: bash
        run: bun run --cwd apps/cli test:packed-smoke
        env:
          RUDEL_PACKED_CLI: ${{ github.workspace }}/.tmp/cli-smoke/install/node_modules/rudel/dist/cli.js

      # The Windows opener integration test is not runnable here: Blacksmith's
      # Windows image ships Chrome but registers no default browser, and
      # http/https are UserChoice-protected, so ShellExecute cannot dispatch a
      # URL headlessly. Opener coverage lives in the canonical opalinehq/cli
      # repo; restore a job here if Blacksmith registers a default browser.

  cli-smoke-required:
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    needs:
      - changes
      - cli-smoke
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Require successful CLI smoke tests when applicable
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CLI_CHANGED: ${{ needs.changes.outputs.cli }}
          CLI_SMOKE_RESULT: ${{ needs.cli-smoke.result }}
        run: |
          if [[ "${CHANGES_RESULT}" != "success" ]]; then
            echo "CLI change detection failed."
            exit 1
          fi

          if [[ "${CLI_CHANGED}" == "true" && "${CLI_SMOKE_RESULT}" != "success" ]]; then
            echo "CLI smoke tests did not succeed: ${CLI_SMOKE_RESULT}"
            exit 1
          fi

  deploy-vercel:
    # CLI smoke can be skipped for non-CLI changes. Evaluate the required gates
    # explicitly so that skip does not propagate to production deployment.
    if: >-
      ${{ !cancelled() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.verify.result == 'success' &&
      needs.integration.result == 'success' &&
      needs.cli-smoke-required.result == 'success' }}
    needs: [verify, integration, cli-smoke-required]
    uses: ./.github/workflows/vercel.yml
    with:
      target: production
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      PG_CONNECTION_STRING: ${{ secrets.PG_CONNECTION_STRING }}

  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch'
    needs: [verify, integration]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: ./.github/actions/setup

      - name: Run Postgres migrations
        run: bun run --cwd packages/sql-schema migrate
        env:
          PG_CONNECTION_STRING: ${{ secrets.PG_CONNECTION_STRING }}

      - name: Setup Fly.io
        if: ${{ !inputs.migrate_only }}
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6

      - name: Deploy
        if: ${{ !inputs.migrate_only }}
        run: |
          flyctl deploy --remote-only \
            --build-arg "VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}" \
            --build-arg "VITE_CHATWOOT_BASE_URL=${{ secrets.VITE_CHATWOOT_BASE_URL }}" \
            --build-arg "VITE_CHATWOOT_WEBSITE_TOKEN=${{ secrets.VITE_CHATWOOT_WEBSITE_TOKEN }}" \
            --build-arg "VITE_POSTHOG_KEY=${{ secrets.VITE_POSTHOG_KEY }}" \
            --build-arg "VITE_POSTHOG_HOST=${{ secrets.VITE_POSTHOG_HOST }}" \
            --build-arg "VITE_POSTHOG_ENABLED=${{ secrets.VITE_POSTHOG_ENABLED }}" \
            --build-arg "VITE_ADMIN_ORGANIZATION_ID=${{ secrets.VITE_ADMIN_ORGANIZATION_ID }}" \
            --build-arg "VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
