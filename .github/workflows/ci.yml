name: CI

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches:
      - main

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Lint, type checks, the build and every test shard run side by side. Tests
# are split by their recorded run time (scripts/ci-tests.ts), and a pull
# request runs only the tests of the workspaces its diff can reach; main runs
# everything, and saves the times its shards measured for later plans.
#
# Each shard plans the whole suite itself and runs its own slice, so no test
# waits for a planning job. The plans agree because they read the same
# inputs: the checkout and the newest timings main saved at least five
# minutes before the run began. The gates prove it from the shard logs.
#
# `verify`, `integration` and `cli-smoke-required` are the checks the main
# ruleset requires, so they stay as small jobs that gate on the parts.
jobs:
  # Job-level conditions skip drafts before allocating a runner.
  plan:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      cli: ${{ steps.plan.outputs.cli }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      # A pull request's checkout is its merge commit, whose first parent is
      # the base it merges into.
      - name: Does the diff reach the CLI
        id: plan
        env:
          PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
        run: |
          base=()
          [[ "${PULL_REQUEST}" == "true" ]] && base=(--base "$(git rev-parse HEAD^1)")
          bun scripts/ci-tests.ts reaches --name cli --packages apps/cli,packages/opaline,packages/rudel-alias "${base[@]}"

  checks:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: ./.github/actions/setup

      - name: Check for local overrides
        run: bun scripts/check-overrides.ts

      - name: Check for accidental disclosures
        run: bun run check:disclosure

      - name: Check pull request disclosure channels
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun scripts/check-disclosure.ts --commits "${{ github.event.pull_request.base.sha }}"
          bun scripts/check-disclosure.ts --pull-request "${{ github.event.pull_request.number }}"

      - name: Test the repository scripts
        run: bun test ./scripts/check-disclosure.test.ts ./scripts/selfhost-artifact.test.ts ./scripts/ci-tests.test.ts

      - name: Lint
        run: bun run lint

  typecheck:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: ./.github/actions/setup

      - name: Type check
        run: bun run turbo run check-types

  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup Bun
        uses: ./.github/actions/setup

      - name: Build
        run: bun run turbo run build

      - name: Verify browser resource budgets in Chrome
        run: bun run --cwd apps/desktop/ui test:resource-budgets:chrome

  unit:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: unit (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Setup Bun for planning
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Pick the recorded test times
        id: timings
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/ci-tests.ts pick-timings

      - name: Restore the recorded test times
        if: steps.timings.outputs.key != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tmp/test-timings.json
          key: ${{ steps.timings.outputs.key }}
          fail-on-cache-miss: true

      - name: Plan this shard
        id: plan
        env:
          PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
          TIMINGS_KEY: ${{ steps.timings.outputs.key }}
          SKIP: "false"
        run: |
          timings=.github/test-timings.json
          [[ -n "${TIMINGS_KEY}" ]] && timings=.tmp/test-timings.json
          base=()
          [[ "${PULL_REQUEST}" == "true" ]] && base=(--base "$(git rev-parse HEAD^1)")
          bun scripts/ci-tests.ts shard --suite unit --shards 3 --index ${{ matrix.shard }} \
            --timings "${timings}" --timings-key "${TIMINGS_KEY}" --skip "${SKIP}" "${base[@]}"

      - name: Setup Node.js
        if: steps.plan.outputs.empty != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup Bun
        if: steps.plan.outputs.empty != 'true'
        uses: ./.github/actions/setup

      - name: Run unit tests
        if: steps.plan.outputs.empty != 'true'
        env:
          ITEMS: ${{ steps.plan.outputs.items }}
        run: bun scripts/ci-tests.ts run --suite unit --items "${ITEMS}"

  integration-shard:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: integration (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.10-alpine
        env:
          POSTGRES_DB: rudel
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username postgres --dbname rudel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    # These credentials are only for the disposable services created above.
    env:
      PASSWORD_AUTH_EMAILS: "*"
      PG_CONNECTION_STRING: postgres://postgres:postgres@localhost:5432/rudel
      PG_DIRECT_CONNECTION_STRING: postgres://postgres:postgres@localhost:5432/rudel
      CLICKHOUSE_URL: http://localhost:8123
      CLICKHOUSE_USER: rudel
      CLICKHOUSE_USERNAME: rudel
      CLICKHOUSE_PASSWORD: rudel-ci
      CLICKHOUSE_DB: default
      CLICKHOUSE_CREDENTIAL_TEST_URL: http://localhost.:8124
      CLICKHOUSE_CREDENTIAL_TEST_USERNAME: rudel_app
      CLICKHOUSE_CREDENTIAL_TEST_PASSWORD: rudel-app-ci
      CLICKHOUSE_CREDENTIAL_TEST_DEFAULT_PASSWORD: default-ci
      SKILL_EXTRACTION_ENABLED: "true"
      SKILL_ANALYTICS_CUTOVER_MODE: all
      SKILL_ANALYTICS_CANARY_ORG_IDS: ""
      TRANSCRIPT_RECORDS_EXTRACTION_ENABLED: "true"
      GIT_OBSERVATION_EXTRACTION_ENABLED: "true"
      GITHUB_SWEEP_ENABLED: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Setup Bun for planning
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Pick the recorded test times
        id: timings
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/ci-tests.ts pick-timings

      - name: Restore the recorded test times
        if: steps.timings.outputs.key != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tmp/test-timings.json
          key: ${{ steps.timings.outputs.key }}
          fail-on-cache-miss: true

      # Integration exercises the server, the CLI, the packages and the
      # scripts. The dashboard, the MCP plugin code (no integration test
      # reaches it) and Markdown outside the plugin skill cannot change its
      # outcome, so PRs touching only those skip it. Every listed condition
      # must hold for a changed file of the integration filter; the skill
      # filter runs the skill's SQL examples. Pushes to main follow the same
      # filter; manual runs always run it.
      - name: Detect integration changes
        id: integration
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          base: main
          predicate-quantifier: every
          filters: |
            integration:
              - "{apps/desktop/server/**,apps/cli/**,packages/**,scripts/**,.github/actions/setup/**,.github/workflows/ci.yml,bun.lock,package.json,turbo.json}"
              - "!apps/desktop/server/src/mcp/**"
              - "!apps/desktop/server/src/handlers/mcp-http*"
              - "!**/*.md"
            skill:
              - "plugin/skills/**"

      - name: Plan this shard
        id: plan
        env:
          PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
          TIMINGS_KEY: ${{ steps.timings.outputs.key }}
          SKIP: "${{ github.event_name != 'workflow_dispatch' && steps.integration.outputs.integration != 'true' && steps.integration.outputs.skill != 'true' }}"
        run: |
          timings=.github/test-timings.json
          [[ -n "${TIMINGS_KEY}" ]] && timings=.tmp/test-timings.json
          base=()
          [[ "${PULL_REQUEST}" == "true" ]] && base=(--base "$(git rev-parse HEAD^1)")
          bun scripts/ci-tests.ts shard --suite integration --shards 8 --index ${{ matrix.shard }} \
            --timings "${timings}" --timings-key "${TIMINGS_KEY}" --skip "${SKIP}" "${base[@]}"

      # Started before the install so ClickHouse boots while Bun installs.
      - name: Start ClickHouse
        if: steps.plan.outputs.empty != 'true'
        run: |
          docker run --detach \
            --name rudel-ci-clickhouse \
            --publish 8123:8123 \
            --env CLICKHOUSE_DB=default \
            --env CLICKHOUSE_USER=rudel \
            --env CLICKHOUSE_PASSWORD=rudel-ci \
            --env CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1 \
            --volume "${GITHUB_WORKSPACE}/.github/clickhouse/config.d/storage-policy.xml:/etc/clickhouse-server/config.d/storage-policy.xml:ro" \
            clickhouse/clickhouse-server:26.3.17.56

          docker run --detach \
            --name rudel-ci-clickhouse-credentials \
            --publish 8124:8123 \
            --env CLICKHOUSE_DB=default \
            --env CLICKHOUSE_PASSWORD=default-ci \
            --env CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1 \
            clickhouse/clickhouse-server:26.3.17.56

      - name: Setup Node.js
        if: steps.plan.outputs.empty != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup Bun
        if: steps.plan.outputs.empty != 'true'
        uses: ./.github/actions/setup

      - name: Wait for ClickHouse
        if: steps.plan.outputs.empty != 'true'
        run: |
          wait_for_clickhouse() {
            local container="$1"
            local credentials="$2"
            local url="$3"

            for attempt in {1..60}; do
              if curl --fail --silent --user "${credentials}" "${url}/ping" | grep --quiet Ok; then
                return 0
              fi
              sleep 1
            done

            docker logs "${container}"
            return 1
          }

          wait_for_clickhouse \
            rudel-ci-clickhouse \
            rudel:rudel-ci \
            http://localhost:8123
          wait_for_clickhouse \
            rudel-ci-clickhouse-credentials \
            default:default-ci \
            http://localhost:8124

      - name: Provision ClickHouse credential test user
        if: steps.plan.outputs.empty != 'true'
        run: |
          curl --fail --silent --show-error \
            --user default:default-ci \
            --data-binary "CREATE USER rudel_app IDENTIFIED WITH sha256_password BY 'rudel-app-ci'" \
            http://localhost:8124/

      - name: Run Postgres migrations
        if: steps.plan.outputs.empty != 'true'
        run: bun run --cwd packages/sql-schema migrate

      - name: Bootstrap fresh ClickHouse (original checksums and controlled F16 verification)
        if: steps.plan.outputs.empty != 'true'
        run: bun run --cwd packages/ch-schema ch:bootstrap

      - name: Run integration tests
        if: steps.plan.outputs.empty != 'true'
        env:
          ITEMS: ${{ steps.plan.outputs.items }}
        run: bun scripts/ci-tests.ts run --suite integration --items "${ITEMS}"

      - name: Fetch the published rudel@0.1.17 CLI
        if: steps.plan.outputs.empty != 'true' && matrix.shard == 0
        run: |
          mkdir -p .tmp/old-cli
          curl -fsSL -o .tmp/old-cli/rudel-0.1.17.tgz https://registry.npmjs.org/rudel/-/rudel-0.1.17.tgz
          tar -xzf .tmp/old-cli/rudel-0.1.17.tgz -C .tmp/old-cli
          node .tmp/old-cli/package/dist/cli.js --version

      - name: Run version-skew tests against the published 0.1.17 CLI
        if: steps.plan.outputs.empty != 'true' && matrix.shard == 0
        run: bun run --cwd packages/cli-harness test:integration:skew
        env:
          RUDEL_OLD_CLI_PATH: ${{ github.workspace }}/.tmp/old-cli/package/dist/cli.js


  verify:
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    needs: [plan, checks, typecheck, build, unit]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every part to pass or be skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          failed="$(jq --raw-output 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key): \(.value.result)"' <<< "${RESULTS}")"
          if [[ -n "${failed}" ]]; then
            echo "${failed}"
            exit 1
          fi

      # The shard counts here match the matrices above.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Prove the unit shards agreed on one plan and ran all of it
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/ci-tests.ts verify-shards --suite unit --shards 3

  integration:
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    needs: [integration-shard]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every shard to pass or be skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          failed="$(jq --raw-output 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key): \(.value.result)"' <<< "${RESULTS}")"
          if [[ -n "${failed}" ]]; then
            echo "${failed}"
            exit 1
          fi

      # The shard counts here match the matrices above.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Prove the integration shards agreed on one plan and ran all of it
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/ci-tests.ts verify-shards --suite integration --shards 8

  # Main saves the times its shards measured, over the snapshot and the last
  # passing runs, for the plans of later runs (`pick-timings`).
  record-timings:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [unit, integration-shard]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      # A new key every run: the cache saves this file when the job ends.
      - name: Save the recorded test times
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tmp/test-timings.json
          key: ci-test-timings-${{ github.run_id }}

      - name: Read the times this run and the last passing runs measured
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/ci-tests.ts recorded --timings .github/test-timings.json --out .tmp/test-timings.json --run "${{ github.run_id }}"

  # The published CLI on every supported OS and Node version; pull requests
  # run it only when they can reach the CLI or its npm launchers.
  cli-smoke:
    needs: plan
    if: needs.plan.outputs.cli == 'true'
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
        node:
          - 20
        include:
          - os: ubuntu-24.04
            node: 22
          - os: ubuntu-24.04
            node: 24
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      # The CLI depends on no other workspace, and its npm launchers have no
      # dependencies of their own.
      - name: Setup Bun
        uses: ./.github/actions/setup
        with:
          filter: "@opalinehq/cli"

      - name: Pack and install all three CLI packages
        shell: bash
        run: |
          rm -rf .tmp/cli-smoke
          mkdir -p .tmp/cli-smoke/package .tmp/cli-smoke/install
          opaline_tarball="$(npm pack ./apps/cli --pack-destination .tmp/cli-smoke/package | tail -n 1)"
          primary_tarball="$(npm pack ./packages/opaline --pack-destination .tmp/cli-smoke/package | tail -n 1)"
          rudel_tarball="$(npm pack ./packages/rudel-alias --pack-destination .tmp/cli-smoke/package | tail -n 1)"
          npm install \
            --prefix .tmp/cli-smoke/install \
            --ignore-scripts \
            --no-audit \
            --no-fund \
            ".tmp/cli-smoke/package/${opaline_tarball}" \
            ".tmp/cli-smoke/package/${primary_tarball}" \
            ".tmp/cli-smoke/package/${rudel_tarball}"

      # Every command of the retired CLI cleans up the computer it runs on, so
      # each run gets a throwaway home directory.
      - name: Verify canonical and alias behavior
        shell: bash
        run: |
          opaline_cli=".tmp/cli-smoke/install/node_modules/@opalinehq/cli/dist/cli.js"
          primary_cli=".tmp/cli-smoke/install/node_modules/opaline/bin/opaline.js"
          rudel_cli=".tmp/cli-smoke/install/node_modules/rudel/bin/rudel.js"

          version="$(node -p "require('./apps/cli/package.json').version")"
          for package_dir in packages/opaline packages/rudel-alias; do
            test "$(node -p "require('./${package_dir}/package.json').version")" = "${version}"
            test "$(node -p "require('./${package_dir}/package.json').dependencies['@opalinehq/cli']")" = "${version}"
          done
          # The retired CLI is one self-contained bundle: installing it pulls in nothing.
          test "$(node -p "Object.keys(require('./apps/cli/package.json').dependencies ?? {}).length")" = "0"

          home_dir() {
            rm -rf ".tmp/cli-smoke/$1" && mkdir -p ".tmp/cli-smoke/$1"
            if command -v cygpath > /dev/null; then cygpath -w "$(pwd)/.tmp/cli-smoke/$1"; else echo "$(pwd)/.tmp/cli-smoke/$1"; fi
          }
          run() {
            local name="$1" cli="$2" home
            shift 2
            home="$(home_dir "home-${name}")"
            printf '%s' '{"session_id":"","transcript_path":"","cwd":""}' |
              HOME="${home}" USERPROFILE="${home}" node "${cli}" "$@" \
                > ".tmp/cli-smoke/${name}.stdout" 2> ".tmp/cli-smoke/${name}.stderr"
          }

          for cli in "${opaline_cli}" "${primary_cli}" "${rudel_cli}"; do
            home="$(home_dir home-version)"
            test "$(HOME="${home}" USERPROFILE="${home}" node "${cli}" --version)" = "${version}"
          done

          for command in "--help" "not-a-command" "hooks claude session-end"; do
            # shellcheck disable=SC2086
            run opaline "${opaline_cli}" ${command}
            # shellcheck disable=SC2086
            run primary "${primary_cli}" ${command}
            # shellcheck disable=SC2086
            run rudel "${rudel_cli}" ${command}
            for name in primary rudel; do
              cmp .tmp/cli-smoke/opaline.stdout ".tmp/cli-smoke/${name}.stdout"
              cmp .tmp/cli-smoke/opaline.stderr ".tmp/cli-smoke/${name}.stderr"
            done
            test ! -s .tmp/cli-smoke/opaline.stderr
          done
          # A hook handler prints nothing: Claude Code adds hook output to the session.
          test ! -s .tmp/cli-smoke/opaline.stdout

      - name: Run packed CLI smoke suite through opaline
        shell: bash
        run: bun run --cwd apps/cli test:packed-smoke
        env:
          OPALINE_PACKED_CLI: ${{ github.workspace }}/.tmp/cli-smoke/install/node_modules/opaline/bin/opaline.js

  cli-smoke-required:
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    needs:
      - cli-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require successful CLI smoke tests when applicable
        env:
          CLI_SMOKE_RESULT: ${{ needs.cli-smoke.result }}
        run: |
          if [[ "${CLI_SMOKE_RESULT}" != "success" && "${CLI_SMOKE_RESULT}" != "skipped" ]]; then
            echo "CLI smoke tests did not succeed: ${CLI_SMOKE_RESULT}"
            exit 1
          fi
