name: "Setup Bun"
description: "Setup Bun and install dependencies with caching"
inputs:
  filter:
    description: >-
      Install only the dependencies of the workspaces this matches (bun
      install --filter), without the shared package cache. Restoring that
      cache unpacks every package of the monorepo, which on Windows takes
      longer than downloading the few a single workspace needs.
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.3.14

    # The installed node_modules, keyed on everything the install reads, so a
    # hit is the tree a fresh install would make and the install is skipped.
    # Main saves it on the first run after a lockfile change, and pull
    # requests read main's caches.
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: inputs.filter == ''
      id: node-modules
      name: Restore node_modules
      with:
        path: |
          node_modules
          apps/*/node_modules
          apps/desktop/*/node_modules
          packages/*/node_modules
        key: ${{ runner.os }}-${{ runner.arch }}-node-modules-bun-1.3.14-${{ hashFiles('bun.lock', 'package.json', 'apps/*/package.json', 'apps/desktop/*/package.json', 'packages/*/package.json', 'patches/**') }}

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: inputs.filter == '' && steps.node-modules.outputs.cache-hit != 'true'
      name: Setup bun cache
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-store-${{ hashFiles('**/bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-store-

    - name: Install dependencies
      if: inputs.filter == '' && steps.node-modules.outputs.cache-hit != 'true'
      run: bun install --frozen-lockfile
      shell: bash

    # Saved straight after the install, before a build or test can write its
    # own caches (.vite, .tmp) into these directories.
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: inputs.filter == '' && steps.node-modules.outputs.cache-hit != 'true'
      name: Save node_modules
      with:
        path: |
          node_modules
          apps/*/node_modules
          apps/desktop/*/node_modules
          packages/*/node_modules
        key: ${{ steps.node-modules.outputs.cache-primary-key }}

    - name: Install the filtered workspaces' dependencies
      if: inputs.filter != ''
      env:
        FILTER: ${{ inputs.filter }}
      run: bun install --frozen-lockfile --filter "${FILTER}"
      shell: bash
