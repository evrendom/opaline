name: "Setup Bun"
description: "Setup Bun and install dependencies with caching"
inputs:
  filter:
    description: >-
      Install only the dependencies of the workspaces this matches (bun
      install --filter), without the shared package cache. Restoring that
      cache unpacks every package of the monorepo, which on Windows takes
      longer than downloading the few a single workspace needs.
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.3.14

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: inputs.filter == ''
      name: Setup bun cache
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-store-${{ hashFiles('**/bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-store-

    - name: Install dependencies
      if: inputs.filter == ''
      run: bun install --frozen-lockfile
      shell: bash

    - name: Install the filtered workspaces' dependencies
      if: inputs.filter != ''
      env:
        FILTER: ${{ inputs.filter }}
      run: bun install --frozen-lockfile --filter "${FILTER}"
      shell: bash
