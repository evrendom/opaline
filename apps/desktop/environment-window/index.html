<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'self'; style-src 'self'; script-src 'self'; font-src 'self'"
		/>
		<title>Connect to Your Server</title>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<form>
			<label for="url">Your Opaline server</label>
			<input id="url" name="url" type="text" placeholder="https://opaline.example.com" autocomplete="off" spellcheck="false" required />
			<p class="message" role="status" aria-live="polite"></p>
			<div class="actions">
				<button type="button" data-cancel>Cancel</button>
				<button type="submit" class="primary">Connect</button>
			</div>
		</form>
		<script src="app.js"></script>
	</body>
</html>
