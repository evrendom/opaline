<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'"
		/>
		<title>Welcome to Opaline</title>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<div class="backdrop"></div>
		<div class="aurora"><i></i><i></i><i></i></div>
		<main class="stage">
			<div class="card-slot">
				<section class="card" hidden>
					<button class="close" type="button" aria-label="Close">
						<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" /></svg>
					</button>
					<div class="card-body"></div>
				</section>
			</div>
			<div class="dots" hidden></div>
			<div class="bar">
				<img class="bar-mark" src="mark.svg" alt="" />
				<div class="bar-text">
					<strong>Opaline</strong>
					<span>See where your coding agents get stuck.</span>
				</div>
				<button class="primary glow" type="button">Get Started</button>
			</div>
		</main>
		<script src="app.js"></script>
	</body>
</html>
