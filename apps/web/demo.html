<!doctype html>
<html lang="en">
<head><meta charset="UTF-8" />
<!-- The demo matches the landing page around it: it follows the visitor's
     system preference. Only <html> changes, which React does not hydrate. -->
<script>
  {
    const darkQuery = matchMedia("(prefers-color-scheme: dark)");
    const applyTheme = () => {
      document.documentElement.classList.toggle("dark", darkQuery.matches);
      document.documentElement.style.colorScheme = darkQuery.matches ? "dark" : "light";
    };
    applyTheme();
    darkQuery.addEventListener("change", applyTheme);
  }
</script><meta name="viewport" content="width=device-width,initial-scale=1" /><meta name="robots" content="noindex" /><title>Opaline product demo</title></head>
<body class="style-luma"><div id="root"><!--demo-html--></div><script id="demo-seed" type="application/json">null</script><div id="demo-boot-error" hidden role="alert" style="position:fixed;bottom:16px;left:16px;background:Canvas;color:CanvasText;padding:16px;z-index:9999">The demo could not start. <button id="demo-boot-retry" type="button">Try again</button></div><script type="module" src="/src/features/demo/boot-demo.ts"></script></body>
</html>
