<!doctype html>
<html lang="en" data-app-shell class="dark" style="color-scheme: dark">
<head><meta charset="UTF-8" />
<script>
  try {
    const theme = sessionStorage.getItem("page-theme");
    const dark = theme === "system" ? matchMedia("(prefers-color-scheme: dark)").matches : theme !== "light";
    if (!dark) {
      document.documentElement.classList.remove("dark");
      document.documentElement.style.colorScheme = "light";
    }
  } catch {}
</script>
<meta name="viewport" content="width=device-width,initial-scale=1" /><meta name="robots" content="noindex" /><title>Opaline product demo</title></head>
<body class="style-luma"><div id="root"><!--demo-html--></div><script id="demo-seed" type="application/json">null</script><div id="demo-boot-error" hidden role="alert" style="position:fixed;bottom:16px;left:16px;background:Canvas;color:CanvasText;padding:16px;z-index:9999">The demo could not start. <button id="demo-boot-retry" type="button">Try again</button></div><script type="module" src="/src/features/demo/boot-demo.ts"></script></body>
</html>
