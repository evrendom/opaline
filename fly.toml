app = "rudel"
primary_region = "fra"

[build]

[[vm]]
  size = "shared-cpu-2x"
  # A resident server materializes sessions above 128 MiB (up to 256 MiB) one
  # at a time (peak about 2.3 GB). Production runs them in the large-ingest
  # Vercel project instead; see deploy/large-ingest.
  memory = "4gb"

[http_service]
  internal_port = 3000
  force_https = true
  # R2 ingest recovery and reconciliation outlive individual HTTP requests.
  # Keep the Fly worker alive through the Vercel cutover watch.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[checks]
  [checks.health]
    port = 3000
    type = "http"
    interval = "10s"
    timeout = "2s"
    path = "/health"
