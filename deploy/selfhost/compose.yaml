name: opaline

services:
  opaline:
    profiles: [server]
    build:
      context: .
      args:
        OPALINE_VERSION: ${OPALINE_VERSION:-latest}
    image: opaline-server:${OPALINE_VERSION:-latest}
    init: true
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      APP_URL: ${OPALINE_PUBLIC_URL:?set OPALINE_PUBLIC_URL in .env}
      PG_CONNECTION_STRING: postgres://opaline:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/opaline
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USERNAME: opaline
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      OPALINE_SETUP_TOKEN: ${OPALINE_SETUP_TOKEN:?set OPALINE_SETUP_TOKEN in .env}
    ports:
      - ${OPALINE_BIND:-0.0.0.0}:${OPALINE_PORT:-4100}:4100
    volumes:
      - opaline-data:/var/lib/opaline

  postgres:
    profiles: [server]
    image: postgres:17.11-bookworm@sha256:665dc7b37ac52a17e298511414c21d23ffa4e6a6ef6225b3e5d59c7afb35e994
    restart: unless-stopped
    environment:
      POSTGRES_USER: opaline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: opaline
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opaline -d opaline"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:26.10.2.103@sha256:b2bfa4d8399ee9973868cc5c1754cb506a6f4b86fbddc41010cc090beb55c85e
    restart: unless-stopped
    environment:
      OPALINE_CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
      OPALINE_CLICKHOUSE_MEMORY: ${CLICKHOUSE_MEMORY:-3Gi}
    ports:
      - ${CLICKHOUSE_BIND:-127.0.0.1}:${CLICKHOUSE_HTTP_PORT:-8123}:8123
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/config.d/opaline.xml:/etc/clickhouse-server/config.d/opaline.xml:ro
      - ./clickhouse/users.d/opaline.xml:/etc/clickhouse-server/users.d/opaline.xml:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 10

  caddy:
    profiles: [https]
    image: caddy:2.11.9@sha256:0c2243efcf437ab7f7a978f1027fcf0d4f9be8a75df27b1b3fbc5dbe0ffa8cf0
    restart: unless-stopped
    depends_on:
      opaline:
        condition: service_healthy
    environment:
      OPALINE_DOMAIN: ${OPALINE_DOMAIN:-}
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  opaline-data:
  postgres-data:
  clickhouse-data:
  caddy-data:
  caddy-config:
